name: Probe follows metric
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tracker-write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node scripts/probe-follows.mjs
      - run: |
          git config user.name "jaredartt-tracker"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "probe results"
          git pull --rebase --autostash origin main || true
          git push
