name: Discord hourly

# Every hour. Discord reports the member count right now but keeps no history,
# so this is the only record of how the server grows — and the only way to see
# what time of day people join.
on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker-write
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Member and presence counts
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: node scripts/discord-snapshot.mjs

      - name: Commit
        run: |
          git config user.name  "jaredartt-tracker"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "discord: $(date -u +%Y-%m-%dT%H:00Z)"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
